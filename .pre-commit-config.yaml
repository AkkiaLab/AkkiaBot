# Install with `just setup` (runs `pre-commit install`, which installs both hook types below).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # Credential scanning, see docs/secret-scanning.md. Uses .gitleaks.toml / .gitleaksignore.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      # Before each commit: staged changes.
      - id: gitleaks
      # Before each push (incl. the first push of a branch): every commit not on a remote yet.
      - id: gitleaks
        alias: gitleaks-unpushed
        name: gitleaks (unpushed commits)
        entry: bash scripts/secret_scan.sh unpushed
        always_run: true
        stages: [pre-push]
      # Full history reachable from HEAD; `just secret-scan` and the CI `secret-scan` job.
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (history)
        entry: bash scripts/secret_scan.sh history
        always_run: true
        stages: [manual]

  - repo: local
    hooks:
      - id: biome
        name: biome check
        language: system
        entry: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        types_or: [javascript, jsx, ts, tsx, json, css]
