# gitleaks configuration (used by pre-commit, `just secret-scan` and the CI `secret-scan` job).
# See docs/secret-scanning.md. Keep the default ruleset and add stricter rules on top.

[extend]
useDefault = true

# The default `telegram-bot-api-token` rule only fires when a keyword such as
# "telegram" sits right before the value, so it missed a token-shaped value in a
# plain `BOT_TOKEN = "..."` assignment (GitHub secret scanning alert #1, see
# docs/secret-scanning.md).
# This rule matches the bare shape anywhere (same shape as tests/test_secret_samples.py):
# numeric bot id, ":", then "A" + 33-34 token characters.
[[rules]]
id = "akkiabot-telegram-bot-token-bare"
description = "Telegram bot token shape without a keyword (bot id + ':A...')"
regex = '''(?:^|[^0-9])([0-9]{5,16}:A[A-Za-z0-9_-]{33,34})(?:[^A-Za-z0-9_-]|$)'''
secretGroup = 1
