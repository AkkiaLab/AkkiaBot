[project]
name = "akkiabot-antispam"
version = "0.1.0"
description = "基于 LLM 的反垃圾分类器"
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.16",
    "langfuse>=5.2",
    "openai>=3.0",
    "pydantic>=2.10",
]

[project.scripts]
akkiabot-antispam-eval = "akkiabot_antispam.evaluate:main"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
