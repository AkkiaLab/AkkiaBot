name: Release RC to staging

# Cut (or recheck) a release candidate and build its backend image, then hand
# over to the runtime machine (docs/release.md §4.1): `just release-staging <tag>`
# takes the staging lease and, while holding it, publishes the Mini App of the
# same sha (webapp-deploy.yml), deploys the backend and runs the acceptance.
# This workflow itself never writes to staging, so it cannot replace a version
# under acceptance. RC tags are only created here (or by release-window.yml
# dispatching here), never by a tag push, so one RC means exactly one run.

run-name: RC ${{ inputs.tag || inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Cut a new RC from the head of releases/<version> (vX.Y.Z), reused if the head already has one
        required: false
        type: string
      tag:
        description: Redeploy this existing RC tag (vX.Y.Z-rc.N); must still be the newest and equal the branch head
        required: false
        type: string

concurrency:
  group: release-rc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      baseline: ${{ steps.check.outputs.baseline }}
    steps:
      - uses: AkkiaLab/AkkiaBot/.github/actions/release-setup@master
        id: setup
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Create or check the RC
        id: check
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$VERSION" ]]; then
            python3 -m scripts.release rc "$VERSION"
            TAG="$(grep '^tag=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::give either version or tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python3 -m scripts.release check-rc "$TAG"

  image:
    needs: rc
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.rc.outputs.sha }}
    permissions:
      contents: read
      packages: write

  handoff:
    needs: [rc, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hand over to the staging deploy and acceptance
        env:
          TAG: ${{ needs.rc.outputs.tag }}
          SHA: ${{ needs.rc.outputs.sha }}
          BASELINE: ${{ needs.rc.outputs.baseline }}
          # Optional; unset means the notification is skipped.
          RELEASE_NOTIFY_WEBHOOK_URL: ${{ secrets.RELEASE_NOTIFY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### $TAG → staging"
            echo "- sha: \`$SHA\`（后端镜像已就绪）"
            echo "- 差异基线：${BASELINE:-无（全量验收）}"
            echo "- 运行机执行：\`just release-staging $TAG <场景>\`（取得 staging 租约后依次部署 Mini App、后端并验收，结束才释放）"
          } >> "$GITHUB_STEP_SUMMARY"
          payload="$(jq -n --arg tag "$TAG" --arg sha "$SHA" --arg baseline "$BASELINE" --arg run "$RUN_URL" \
            '{kind: "release-rc-ready", tag: $tag, sha: $sha, baseline: $baseline, run: $run}')"
          if [[ -z "$RELEASE_NOTIFY_WEBHOOK_URL" ]]; then
            echo "::notice::RELEASE_NOTIFY_WEBHOOK_URL not configured; start the staging acceptance manually"
            exit 0
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data "$payload" "$RELEASE_NOTIFY_WEBHOOK_URL")"
          echo "Release notification webhook: HTTP $code"
          [[ "$code" =~ ^2 ]]
