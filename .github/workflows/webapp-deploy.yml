name: Webapp deploy

# Publishes apps/webapp to Cloudflare Pages with `wrangler pages deploy`
# (docs/webapp.md). This workflow never touches production:
#   - pull requests → per-branch preview (`<branch>.<project>.pages.dev`);
#   - release-rc.yml (an RC sha) and manual runs → the fixed alias
#     `staging.<project>.pages.dev`, the Mini App of the staging bot. Master pushes
#     no longer publish staging, so master moving on cannot replace the commit
#     under staging acceptance (docs/release.md §4.1).
# Both use the `webapp-preview` environment (staging API, staging Turnstile key,
# dev/staging Cloudflare token). Production only receives builds through
# webapp-promote.yml, for commits that passed the staging acceptance.
#
# Needs repository variable CLOUDFLARE_ACCOUNT_ID and, on `webapp-preview`, the
# secret CLOUDFLARE_API_TOKEN plus the variables VITE_API_BASE_URL and
# VITE_TURNSTILE_SITE_KEY. Without the token (e.g. fork PRs) the build and the
# dev-mock check still run; only the upload is skipped.

on:
  workflow_call:
    inputs:
      sha:
        description: Full commit sha to publish to the staging alias (the RC)
        required: true
        type: string
  pull_request:
    paths:
      - apps/webapp/**
      - .github/actions/webapp-build/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/webapp-deploy.yml
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to publish to the staging alias (default the selected ref)
        required: false
        type: string

concurrency:
  group: webapp-deploy-${{ inputs.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'akkiabot-webapp' }}
  WRANGLER_VERSION: 4.162.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: webapp-preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Commit to publish
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/webapp-build
        with:
          api-base-url: ${{ vars.VITE_API_BASE_URL }}
          turnstile-site-key: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          sha: ${{ steps.rev.outputs.sha }}
          environment: ${{ github.event_name == 'pull_request' && 'preview' || 'staging' }}
      - name: Decide whether to upload
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Branch aliases that belong to other targets must never come from a PR.
          if [[ "$HEAD_REF" == "staging" || "$HEAD_REF" == "master" ]]; then
            echo "::error::PR branch name '$HEAD_REF' is reserved for a deployment alias"
            exit 1
          fi
          if [[ "$HAS_TOKEN" != "true" ]]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not available (not configured yet, or a fork PR); skipping the Pages upload."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          [[ -n "$ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "$API_BASE_URL" ]] || missing+=(VITE_API_BASE_URL)
          [[ -n "$SITE_KEY" ]] || missing+=(VITE_TURNSTILE_SITE_KEY)
          if (( ${#missing[@]} )); then
            echo "::error::missing GitHub variables for this environment: ${missing[*]}"
            exit 1
          fi
          echo "upload=true" >> "$GITHUB_OUTPUT"
      - name: Upload to Cloudflare Pages
        id: deploy
        if: steps.gate.outputs.upload == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Untrusted branch names go through env, never interpolated into the script.
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'staging' }}
          COMMIT_SHA: ${{ steps.rev.outputs.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy apps/webapp/dist \
            --project-name="$PAGES_PROJECT" \
            --branch="$BRANCH" \
            --commit-hash="$COMMIT_SHA" \
            --commit-dirty=true
          url="$(jq -r 'select(.type == "pages-deploy-detailed") | .alias // .url' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
