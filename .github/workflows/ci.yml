name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - justfile
              - .github/workflows/ci.yml
            python:
              - *shared
              - "**/*.py"
              - "**/pyproject.toml"
              - uv.lock
              - .python-version
              - apps/server/**
              - packages/**
              - tests/**
              - scripts/**
              - tools/**
              - deploy/**
              - docs/operations.md
            web:
              - *shared
              - apps/webapp/**
              - tools/api-types/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - biome.json
              - .nvmrc
            docker:
              - *shared
              - deploy/Dockerfile
              - deploy/compose.yaml
              - deploy/backup.sh
              - deploy/restore.sh
              - deploy/.env.example
              - deploy/app.env.example
              - .dockerignore
              - "**/pyproject.toml"
              - uv.lock
              - apps/server/src/**
              - packages/*/src/**
              - tools/*/pyproject.toml

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    # Integration tests (migrations, repositories, Redis cache contract) run
    # against real services; locally they are skipped unless the same env
    # vars are set (see `just test-integration`).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: akkiabot
          POSTGRES_PASSWORD: akkiabot
          POSTGRES_DB: akkiabot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akkiabot -d akkiabot"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AKKIABOT_TEST_DATABASE_URL: postgresql+asyncpg://akkiabot:akkiabot@127.0.0.1:5432/akkiabot
      AKKIABOT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just setup-py
      - name: Lint (ruff + import-linter)
        run: just lint-py
      - name: Typecheck (pyright)
        run: just typecheck-py
      - name: Test (pytest, incl. PostgreSQL / Redis integration)
        run: just test-py
      - name: Migrate via CLI (PostgreSQL)
        env:
          DB_URL: postgresql+asyncpg://akkiabot:akkiabot@127.0.0.1:5432/akkiabot
        run: uv run akkiabot migrate

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: extractions/setup-just@v4
      - run: just setup-web
      - name: Lint (biome)
        run: just lint-web
      - name: Generated API types are up to date
        # apps/webapp/openapi.json itself is checked against the backend by pytest.
        run: |
          pnpm --filter @akkiabot/api-types gen-api
          git diff --exit-code -- apps/webapp/src/api/schema.d.ts
      - name: Typecheck (tsc)
        run: just typecheck-web
      - name: Test (vitest)
        run: just test-web
      - name: Build
        run: pnpm --filter @akkiabot/webapp build
      - name: No dev-only Telegram mock in the production bundle
        run: bash apps/webapp/scripts/check-no-dev-mock.sh apps/webapp/dist

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          tags: akkiabot:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (prints version and exits)
        run: |
          out="$(docker run --rm akkiabot:ci)"
          echo "$out"
          [[ "$out" =~ ^akkiabot\ [0-9]+\.[0-9]+\.[0-9]+ ]]
      # Production compose stack with the image just built: postgres + redis
      # healthy, then the one-shot `migrate` service applies every migration.
      # app/cloudflared need a real bot token / tunnel and are not started here.
      - name: Compose stack smoke test (postgres, redis, migrate)
        run: |
          stack="$RUNNER_TEMP/stack"
          mkdir -p "$stack"
          cp deploy/compose.yaml deploy/backup.sh deploy/restore.sh "$stack/"
          cp deploy/app.env.example "$stack/app.env"
          sed -e 's/^AKKIABOT_IMAGE=.*/AKKIABOT_IMAGE=akkiabot/' \
              -e 's/^AKKIABOT_TAG=.*/AKKIABOT_TAG=ci/' \
              -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci0compose0smoke/' \
              -e 's/^CLOUDFLARED_TOKEN=.*/CLOUDFLARED_TOKEN=fake-tunnel-token-for-tests/' \
              deploy/.env.example > "$stack/.env"
          cd "$stack"
          docker compose config --quiet
          docker compose up -d --wait postgres redis
          docker compose run --rm migrate
          rev="$(docker compose exec -T postgres psql -U akkiabot -d akkiabot -tAc 'select version_num from alembic_version')"
          echo "alembic revision: $rev"
          [[ -n "$rev" ]]
      # docs/operations.md §6.1 / §5.2 against real PostgreSQL: the first
      # cron-style backup from a clean directory, then a rollback across a
      # schema change (a fake newer migration) restored with restore.sh.
      - name: Backup and migration-rollback drill
        run: |
          cd "$RUNNER_TEMP/stack"
          psql() { docker compose exec -T postgres psql -U akkiabot -d akkiabot -v ON_ERROR_STOP=1 -tAc "$1"; }
          old_rev="$(psql 'select version_num from alembic_version')"
          install -d -m 700 backups
          /bin/sh -c "cd '$PWD' && ./backup.sh >> backups/backup.log 2>&1"
          cat backups/backup.log
          dump="$(ls backups/akkiabot-*.dump)"
          # "Upgrade": a newer migration adds a table and a column and bumps the revision.
          psql "create table rollback_probe (id int); alter table chat add column rollback_probe int; update alembic_version set version_num = 'ffff_newer'"
          ./restore.sh "$dump" | tee restore.log
          grep -q "alembic revision: $old_rev\$" restore.log
          [[ "$(psql "select count(*) from information_schema.tables where table_name = 'rollback_probe'")" == 0 ]]
          [[ "$(psql "select count(*) from information_schema.columns where table_name = 'chat' and column_name = 'rollback_probe'")" == 0 ]]
          # The old image's migrate is a no-op on the restored schema.
          docker compose run --rm migrate
          [[ "$(psql 'select version_num from alembic_version')" == "$old_rev" ]]
      - name: Compose logs on failure
        if: failure()
        run: cd "$RUNNER_TEMP/stack" && docker compose logs --no-color || true

  # Credential scan (docs/secret-scanning.md). Fixed check name `secret-scan`; not
  # path-filtered, so it runs for every PR and push. Scans every commit reachable
  # from the checked-out ref (for a PR: master history + all PR commits), not just
  # the head tree, with the same pinned gitleaks and rules as pre-commit.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-gitleaks-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Scan history (gitleaks, redacted)
        run: uv run --only-group dev pre-commit run gitleaks-history --hook-stage manual --all-files

  # Single required check for branch protection: fails if any job failed,
  # passes when jobs were skipped by the path filter.
  ci-ok:
    if: always()
    needs: [changes, python, web, docker, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi
          done
