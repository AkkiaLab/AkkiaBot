name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Check title and "Closes BOT-<n>"
        # The script reads title/body from the event file at GITHUB_EVENT_PATH.
        # Never pass PR text through `env`, `with` or `run`: Actions prints a
        # step's env into the public log, and `${{ }}` in `run` is injectable.
        run: python3 scripts/check_pr_meta.py
