name: Webapp promote to production

# The only way a build reaches production (bot.akkia.moe). Promotes one exact
# master commit that already passed the staging acceptance (docs/webapp.md):
#   1. `verify`: the sha is on master and carries the commit status
#      `staging-acceptance` = success (written by `just e2e-staging --record-status`);
#   2. `deploy` (environment `webapp-production`, required reviewers): checks out
#      that sha, builds it with the production VITE_* values only, uploads it as
#      the Pages production deployment and smoke-tests it.
# Run it from master (`gh workflow run webapp-promote.yml -f sha=<sha>`); the
# environment only accepts deployments from master.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character master commit that passed the staging acceptance
        required: true
        type: string

concurrency:
  group: webapp-promote
  cancel-in-progress: false

permissions:
  contents: read
  statuses: read

env:
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'akkiabot-webapp' }}
  WRANGLER_VERSION: 4.162.0
  ACCEPTANCE_CONTEXT: staging-acceptance

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit is on master and passed the staging acceptance
        id: check
        env:
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character lowercase commit id"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::$SHA is not on master"
            exit 1
          fi
          # Newest status per context wins (the API lists newest first).
          state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" --paginate \
            --jq "[.[] | select(.context == \"$ACCEPTANCE_CONTEXT\")][0].state // \"missing\"" | head -n1)"
          echo "staging acceptance of $SHA: $state"
          if [[ "$state" != "success" ]]; then
            echo "::error::$SHA has no successful '$ACCEPTANCE_CONTEXT' status; run the staging acceptance first"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: webapp-production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          # The build action and workflow come from this checkout, i.e. the
          # accepted commit itself; nothing newer is mixed in.
          persist-credentials: false
      - name: Checked-out commit is the accepted one
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: ./.github/actions/webapp-build
        with:
          api-base-url: ${{ vars.VITE_API_BASE_URL }}
          turnstile-site-key: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          sha: ${{ needs.verify.outputs.sha }}
          environment: production
      - name: Production configuration is complete
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          missing=()
          [[ "$HAS_TOKEN" == "true" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "$API_BASE_URL" ]] || missing+=(VITE_API_BASE_URL)
          [[ -n "$SITE_KEY" ]] || missing+=(VITE_TURNSTILE_SITE_KEY)
          if (( ${#missing[@]} )); then
            echo "::error::missing production configuration: ${missing[*]}"
            exit 1
          fi
      - name: Upload as the Pages production deployment
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ needs.verify.outputs.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy apps/webapp/dist \
            --project-name="$PAGES_PROJECT" \
            --branch=master \
            --commit-hash="$SHA"
          url="$(jq -r 'select(.type == "pages-deploy-detailed") | .url' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment of $SHA: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          for path in "/" "/captcha?challenge=00000000-0000-4000-8000-000000000000"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors "$URL$path")"
            echo "$path -> $code"
            [[ "$code" == 200 ]]
          done
          deployed="$(curl -fsS --retry 5 --retry-all-errors "$URL/version.json" | jq -r .sha)"
          echo "version.json sha: $deployed"
          [[ "$deployed" == "$SHA" ]]
