name: e2e prune trigger

# Weekly: if any commit got a `staging-acceptance` status in the last 7 days
# (i.e. a staging release acceptance created a test group), call the optional
# prune webhook so whoever holds the test sessions prunes old acceptance groups
# (docs/e2e-acceptance.md §6.3). No release, or no webhook configured: no call.
# This workflow never touches Telegram sessions.

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: e2e-prune-trigger
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Check for staging releases and trigger the clean-up
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Secret: never echoed; the script only reports the HTTP status.
          E2E_PRUNE_WEBHOOK_URL: ${{ secrets.E2E_PRUNE_WEBHOOK_URL }}
        run: python3 scripts/e2e_prune_trigger.py
