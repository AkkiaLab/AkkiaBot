name: Release window

# Thursday and Sunday, UTC+8 (docs/release.md §5): 16:xx prepare, 18:xx freeze
# (下车 + RC to staging), 20:xx release (seal the accepted RC, then production
# approval). Every run decides again from the clock when it starts and the
# current repository state; completed actions are deduplicated by their own
# checks (docs/release.md §5). GitHub may delay or skip schedule events, so the
# crons below are only a fallback: an external scheduler dispatches phase=auto
# shortly after each phase starts. Manual
# entry (加车 / patch release): dispatch with phase and version; dry_run only
# reports the decisions (no branch, RC, dispatch, PR retarget or seal).

run-name: 发布窗口 ${{ inputs.phase || 'scheduled' }} ${{ inputs.version }}${{ inputs.dry_run && ' (dry-run)' || '' }}

on:
  schedule:
    - cron: "13 8 * * 0,4" # 16:13 UTC+8 prepare
    - cron: "3 10 * * 0,4" # 18:03 UTC+8 freeze
    - cron: "3 12 * * 0,4" # 20:03 UTC+8 release
  workflow_dispatch:
    inputs:
      phase:
        description: auto (from the clock) / prepare / freeze / release
        required: false
        default: auto
        type: choice
        options: [auto, prepare, freeze, release]
      version:
        description: Release to act on (vX.Y.Z); empty = the current regular release
        required: false
        type: string
      dry_run:
        description: Only report what the phase would do; write nothing
        required: false
        default: false
        type: boolean

concurrency:
  group: release-window
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Any release branch at all?
        id: boot
        run: |
          if git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY.git" 'releases/*' >/dev/null; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no releases/* branch yet (flow not bootstrapped, docs/release.md §6); skipping"
          fi
      - uses: AkkiaLab/AkkiaBot/.github/actions/release-setup@master
        if: steps.boot.outputs.active == 'true'
        id: setup
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Run the window phase
        if: steps.boot.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          PHASE: ${{ inputs.phase }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          [[ -n "$PHASE" && "$PHASE" != auto ]] && args+=(--phase "$PHASE")
          [[ -n "$VERSION" ]] && args+=(--version "$VERSION")
          [[ "$DRY_RUN" == true ]] && args+=(--dry-run)
          python3 -m scripts.release window "${args[@]}"
