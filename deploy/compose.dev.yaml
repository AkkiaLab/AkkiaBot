# Local development services. Start with `just dev` (or
# `docker compose -f deploy/compose.dev.yaml up -d`).
# Credentials here are for local use only.
name: akkiabot-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: akkiabot
      POSTGRES_PASSWORD: akkiabot
      POSTGRES_DB: akkiabot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akkiabot -d akkiabot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
