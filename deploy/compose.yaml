# Production / staging stack: app + postgres + redis + cloudflared + alloy.
# Runbook: docs/operations.md. On the server, put this file next to `.env`
# (compose variables, from deploy/.env.example) and `app.env` (application
# config, from deploy/app.env.example), then:
#
#   docker compose up -d --wait
#
# `migrate` runs `akkiabot migrate` to completion before `app` starts.
# Networks:
#   backend — app, migrate, postgres, redis; internal (no route to the internet)
#   edge    — app, cloudflared; the tunnel only forwards to app:8000
#   telemetry — app, alloy; Alloy scrapes app:9464, probes app:8000/readyz and
#             pushes to Grafana Cloud (docs/observability.md)
# The metrics listener (app:9464) is never published and must never be a
# tunnel target. `observability/config.alloy` must sit next to this file.

x-app: &app
  image: ${AKKIABOT_IMAGE:-ghcr.io/akkialab/akkiabot}:${AKKIABOT_TAG:-latest}
  env_file: app.env
  environment:
    # Wiring that depends on this stack; it overrides values from app.env.
    # POSTGRES_PASSWORD is used inside a URL: keep it [A-Za-z0-9] (openssl rand -hex 32).
    DB_URL: postgresql+asyncpg://akkiabot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/akkiabot
    REDIS_URL: redis://redis:6379/0
    SERVER_HOST: 0.0.0.0
    SERVER_PORT: "8000"
    OBSERVABILITY_LOG_FORMAT: json
    # Reachable inside the compose networks only (scraped by Alloy).
    OBSERVABILITY_METRICS_HOST: 0.0.0.0
    OBSERVABILITY_METRICS_PORT: "9464"
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: akkiabot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: akkiabot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akkiabot -d akkiabot"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend, edge, telemetry]
    # Loopback only, for health checks from the host. Never publish 9464.
    ports:
      - "127.0.0.1:${AKKIABOT_HTTP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    stop_grace_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2026.11.2
    restart: unless-stopped
    # Remotely managed tunnel: the public hostname -> http://app:8000 rule lives
    # in the Cloudflare dashboard (docs/operations.md §DNS 与 tunnel).
    command: ["tunnel", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:?set CLOUDFLARED_TOKEN in .env}
      TUNNEL_METRICS: 127.0.0.1:20241
      # HTTP/2 over TCP instead of the default QUIC (UDP): QUIC dropped repeatedly
      # on the staging host; used for production too.
      TUNNEL_TRANSPORT_PROTOCOL: http2
      NO_AUTOUPDATE: "true"
    depends_on:
      app:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    logging: *logging

  alloy:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    # No depends_on: Alloy must keep running (and keep reporting /readyz
    # failures) while the app is down. Its UI stays inside the container.
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      AKKIABOT_ENV: ${AKKIABOT_ENV:-production}
      AKKIABOT_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in .env}
      AKKIABOT_METRICS_TARGET: app:9464
      AKKIABOT_READYZ_URL: http://app:8000/readyz
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:?set GRAFANA_CLOUD_PROMETHEUS_URL in .env}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER:?set GRAFANA_CLOUD_PROMETHEUS_USER in .env}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:?set GRAFANA_CLOUD_LOKI_URL in .env}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:?set GRAFANA_CLOUD_LOKI_USER in .env}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:?set GRAFANA_CLOUD_TOKEN in .env}
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      # Container discovery and log tailing. Read-only mount, but the Docker API
      # itself is root-equivalent: keep this image pinned and trusted.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks: [telemetry]
    logging: *logging

networks:
  backend:
    internal: true
  edge: {}
  # Not internal: Alloy pushes to Grafana Cloud.
  telemetry: {}

volumes:
  postgres-data:
  redis-data:
  alloy-data:
